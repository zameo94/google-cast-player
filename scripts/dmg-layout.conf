# Geometry of the disk image window, in Finder points.
#
# Read by scripts/make-dmg.sh when it arranges the window through Finder, and by
# scripts/make-artwork.swift when it draws the background, which works at twice these
# values because the image is 1200x800 pixels shown in a 600x400 window. One file owns the
# numbers, so moving an icon cannot leave the background chevron pointing elsewhere.

WINDOW_LEFT=300
WINDOW_TOP=160
WINDOW_RIGHT=900
WINDOW_BOTTOM=560

APP_X=150
APPS_X=450
ICON_Y=190
